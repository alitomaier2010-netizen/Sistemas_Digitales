; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = chris--a/Keypad
monitor_speed = 115200
build_src_filter = +<*> -<prueba_hardware.cpp> -<prueba_sensor.cpp>

; Programa de prueba de hardware (sin PIR)
; Subir con:  pio run -e prueba_hw -t upload
[env:prueba_hw]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = chris--a/Keypad
monitor_speed = 115200
build_src_filter = -<*> +<prueba_hardware.cpp>

; Programa de prueba del sensor PIR
; Subir con:  pio run -e prueba_pir -t upload
[env:prueba_pir]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<prueba_sensor.cpp>
