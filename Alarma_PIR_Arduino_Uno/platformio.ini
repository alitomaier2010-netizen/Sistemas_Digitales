; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

; Programa principal de la alarma
[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = chris--a/Keypad
monitor_speed = 115200
build_src_filter = +<*> -<prueba_hardware.cpp> -<prueba_sensor.cpp>

; Prueba de hardware (LEDs, zumbador, teclado y PIR)
; Subir con:  pio run -e prueba_hw -t upload
[env:prueba_hw]
platform = atmelavr
board = uno
framework = arduino
lib_deps = chris--a/Keypad
monitor_speed = 115200
build_src_filter = -<*> +<prueba_hardware.cpp>

; Prueba del sensor PIR
; Subir con:  pio run -e prueba_pir -t upload
[env:prueba_pir]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<prueba_sensor.cpp>
